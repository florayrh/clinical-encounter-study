<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}</style>
<title>Clinical Encounter Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: a single form column for every survey step, a two-pane visit screen (video stage + note panel) for the encounter */
:root{
  --bg:#f5f5f3; --surface:#ffffff; --ink:#141414; --muted:#5f5f5c; --line:#d5d5d1; --fill:#ebebe8; --focus:#141414;
  --stage:#161616; --stage-2:#222221; --stage-ink:#f3f3f1; --stage-muted:#9b9b97; --stage-line:#3c3c3a; --overlay:rgba(16,16,16,.94);
  --sans:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111110; --surface:#1a1a19; --ink:#ededeb; --muted:#a3a3a0; --line:#353533; --fill:#242423; --focus:#ededeb;
    --stage:#050505; --stage-2:#171716; --stage-ink:#f3f3f1; --stage-muted:#8f8f8b; --stage-line:#343432; --overlay:rgba(5,5,5,.94);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111110; --surface:#1a1a19; --ink:#ededeb; --muted:#a3a3a0; --line:#353533; --fill:#242423; --focus:#ededeb;
  --stage:#050505; --stage-2:#171716; --stage-ink:#f3f3f1; --stage-muted:#8f8f8b; --stage-line:#343432; --overlay:rgba(5,5,5,.94);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:1.05rem}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:3px 9px;border-radius:99px}
.steps li.done{color:var(--ink)}
.steps li.cur{color:var(--bg);background:var(--ink)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wide{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.3;margin:0;text-wrap:balance}
h3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--muted);font-weight:600}
p{margin:0}
ul{margin:0;padding-left:20px}
.lede{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:var(--r);padding:10px 18px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:.84rem}
a.btn{text-decoration:none;display:inline-block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.qtext{font-weight:600}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:84px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--ink)}
.opt:has(input:checked){border-color:var(--ink)}
.likert{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.likert label{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;font-size:.78rem;line-height:1.25;text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 4px;cursor:pointer;min-width:0}
@media (max-width:700px){.likert{grid-template-columns:minmax(0,1fr)}.likert label{flex-direction:row;text-align:left;padding:8px 10px;font-size:.88rem}}
.likert label:has(input:checked){border-color:var(--ink);background:var(--fill)}
.likert input{accent-color:var(--ink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted)}
.err{font-size:.88rem;font-weight:600;border-left:3px solid var(--ink);padding-left:10px}
.notice{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc{font-family:var(--mono);font-size:.84rem;line-height:1.6;white-space:pre-wrap;background:var(--fill);border-radius:4px;padding:14px;overflow-x:auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.split{grid-template-columns:minmax(0,1fr)}}
.dxblock{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.range-row{display:grid;grid-template-columns:minmax(0,1fr) 3ch;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ink)}
/* visit */
.visit{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.visit{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--stage);color:var(--stage-ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;user-select:none}
.speakers{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3%;padding:8% 6% 0;min-height:0}
.spk{border:1px solid var(--stage-line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--stage-2);transition:border-color .2s;min-height:0}
.spk.on{border:2px solid var(--stage-ink)}
.avatar{width:clamp(36px,6vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid var(--stage-muted);display:grid;place-items:center;font-family:var(--serif);font-size:clamp(.9rem,1.6vw,1.2rem)}
.spk .nm{font-weight:600;font-size:clamp(.75rem,1.3vw,.92rem)}
.spk .rl{font-size:.68rem;color:var(--stage-muted);letter-spacing:.08em;text-transform:uppercase}
.caption{min-height:4.4em;padding:12px 6% 16px;font-size:clamp(.82rem,1.55vw,1.08rem);line-height:1.45;display:flex;align-items:center}
.caption b{font-weight:600;margin-right:.45em}
.stage video{pointer-events:none;flex:1;min-height:0;width:100%;object-fit:contain;background:#000;display:block}
.stage.has-video .caption{position:absolute;left:0;right:0;bottom:0;min-height:0;background:rgba(0,0,0,.62);color:#fff;padding:8px 6% 10px;z-index:2}
.stage.has-video .caption:empty{display:none}
.badge{z-index:2;position:absolute;top:12px;right:14px;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--stage-ink);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.drt-dot{position:absolute;top:14px;left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--stage-ink);box-shadow:0 0 0 4px rgba(255,255,255,.25);opacity:0;pointer-events:none;z-index:3}
.drt-dot.on{opacity:1}
.overlay{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--stage-ink)}
.overlay .big{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.45rem)}
.overlay .sub{color:var(--stage-muted);max-width:44ch;font-size:.9rem}
.overlay .btn{background:var(--stage-ink);color:var(--stage);border-color:var(--stage-ink)}
.fix{flex:1;display:grid;place-items:center;font-family:var(--mono);font-size:2rem;color:var(--stage-muted)}
.track{height:4px;background:var(--line);border-radius:2px;position:relative;margin-top:10px;overflow:visible}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);border-radius:2px}
.track .tick{position:absolute;top:-3px;width:2px;height:10px;background:var(--muted)}
.under{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:440px;max-height:80vh;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.panel-h .t{font-weight:600}
.panel-h .s{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel-b{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.panel textarea{flex:1;min-height:360px;font-family:var(--mono);font-size:.84rem;line-height:1.55}
.note-sec h4{margin:0 0 4px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note-sec ul{padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.tag{font-size:.62rem;border:1px solid var(--ink);border-radius:3px;padding:0 4px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.ritem{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ritem.done{background:var(--fill)}
.ritem .st{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ritem .row{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:.9rem;margin:auto;text-align:center;max-width:30ch}
.example{border:1px solid var(--line);border-radius:4px}
.example .eh{padding:8px 14px;border-bottom:1px solid var(--line);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.example .doc{background:transparent}
table.sum{border-collapse:collapse;width:100%;font-size:.86rem}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.sum th{font-weight:600;color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:600}
.recbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:.88rem}
.recbar .recdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.recbar.on .recdot{background:var(--ink);animation:blink 1.6s infinite}
.recbar.off{color:var(--muted)}
.recbar .rectime{margin-left:auto}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gbtn{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.gbtn:hover{border-color:var(--ink)}
.gbtn .gk{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.gbtn .gl{font-weight:600}
.gbtn .gd{font-size:.84rem;color:var(--muted)}
.wc{font-size:.8rem;color:var(--muted);text-align:right}
@media (prefers-reduced-motion:reduce){.recbar.on .recdot{animation:none}.badge i{animation:none}.track .fill{transition:none!important}.spk{transition:none}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Clinical Encounter Study</div>
    <ol class="steps" id="steps"></ol>
  </div>
</header>
<main id="app"></main>

<script>
(() => {
"use strict";

/* ============================================================
   STUDY CONFIGURATION: fill these in before sending the link
   ============================================================ */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzWAb3N5umDQ7WS7TUMLxSnTIve40dYqazpqk-gJ3erExmmRmmVOtnH-3bBSST5iEB-/exec",  // Google Apps Script web app URL
  GIFT_CARD_FORM_URL: "",     // separate form for the gift card, not linked to responses
  CONTACT_EMAIL: "",          // shown on the consent and debrief pages
  IRB_PROTOCOL: "",           // shown on the consent page
  SHOW_CAPTIONS: false        // show the spoken text under the video
};

/* ---------- URL parameters ----------
   ?pid=ABC123   participant ID (optional, otherwise generated)
   ?src=penn     recruitment source label (optional)
   ?test=1       test mode: not counted in group balancing, shows the data panel at the end
   ?test=1&g=G3  test mode with a fixed group
   ?test=1&fast=1  test mode with all timers 8x faster
   ?test=1&endpoint=URL  test against another backend */
const QS = new URLSearchParams(location.search);
const TEST = QS.get("test") === "1";
if (TEST && QS.get("endpoint")) CONFIG.ENDPOINT = QS.get("endpoint");
const cleanId = v => (v || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);

/* ---------- settings ---------- */
const FAST = TEST && (QS.get("fast") === "1" || location.hash === "#fast");
const SPEED = FAST ? 8 : 1;
const DRT_SPEED = 1;   // the dot runs at real timing in every mode
const CP_SECONDS = 30;                              // checkpoint length, equal across conditions
const PRACTICE_CP_SECONDS = 20;
const BASELINE_SECONDS = 30;
const T0 = performance.now();
const now = () => Math.round(performance.now() - T0);

const SECTIONS = ["Consent", "Background", "Training", "Visit", "Questions", "Finish"];

const CONDITIONS = {
  G1: { label: "Concurrent self-documentation", documenter: "self", note_visible_during_visit: true, interactive: false },
  G2: { label: "Deferred self-documentation", documenter: "self", note_visible_during_visit: false, interactive: false },
  G3: { label: "AI scribe, draft not shown", documenter: "ai", note_visible_during_visit: false, interactive: false },
  G4: { label: "AI scribe, draft shown", documenter: "ai", note_visible_during_visit: true, interactive: false },
  G5: { label: "AI scribe, interactive confirmation", documenter: "ai", note_visible_during_visit: true, interactive: true }
};

/* ---------- stimulus content ---------- */
const NOTE_SECTIONS = ["Chief complaint", "History of present illness", "Pertinent history", "Recent travel and activity", "Medications", "Allergies", "Vitals"];
const NOTE_TEMPLATE = "Chief complaint:\n\nHistory of present illness:\n\nPertinent history:\n\nMedications:\n\nAllergies:\n\nVitals:\n\nAssessment and plan:\n";

const CASE = {
  id: "chest-pain-01",
  reference_diagnosis: "Pulmonary embolism",
  patient: { name: "Dana Reyes", initials: "DR", label: "Patient, 34" },
  intro: "Dana Reyes, 34, is a new patient at your primary care clinic.",
  video: ["videos/case_part1.mp4", "videos/case_part2.mp4", "videos/case_part3.mp4"],
  durations: [36.05, 30.04, 39.06],
  cues: [[0, 1.26, 14.98, 16.2, 27.86, 30.04], [0, 2.39, 14.9, 16.2], [0, 1.51, 14.78, 17.2, 22.1, 29.98]],   // start time (s) of each line
  subs: [
    [[0, "D", "What brings you in today?"], [1.26, "P", "I've had chest pain for about four days."], [3.77, "P", "It comes and goes, mostly on the right side, and sometimes it's sharp."], [7.64, "P", "I thought it was my reflux."], [9.5, "P", "I've had that on and off for years, usually after coffee or spicy food, and I had a lot of both last week."], [14.98, "D", "Why last week?"], [16.2, "P", "I drove to Savannah to help my sister move. About nine hours each way."], [20.4, "P", "Lots of boxes and three flights of stairs. I got back last Sunday."], [24.34, "P", "But we had a nice walk along the river one evening."], [27.86, "D", "Any medications or allergies?"], [30.04, "P", "Omeprazole when the reflux is bad, and my birth control pill."], [34.73, "P", "No allergies."]],
    [[0, "D", "What makes the pain worse?"], [2.39, "P", "Taking a deep breath. If I yawn, it catches right here."], [6.5, "P", "Maybe it's a little worse after dinner, but it's hard to tell."], [10.26, "P", "It stays in one spot."], [12.01, "P", "No fever, just a little cough yesterday."], [14.9, "D", "Anything else going on?"], [16.2, "P", "Work is stressful. We have a big deadline, and I haven't slept well."], [19.9, "P", "I had panic attacks in college, so maybe it's that."], [22.67, "P", "Oh, and my left calf is sore, probably from the stairs."], [25.6, "P", "It feels tight when I walk, and my ankle swells a little by the end of the day."]],
    [[0, "D", "Any shortness of breath?"], [1.51, "P", "Yes, actually. Yesterday I had to stop halfway up the stairs at work."], [6.67, "P", "That's not like me. I run three times a week."], [10.22, "P", "My heart has been racing a little too, but I assumed it was the coffee."], [14.78, "D", "Any family history of blood clots?"], [17.2, "P", "Not that I know of. My mom had a vein problem in her leg after surgery once."], [22.1, "D", "Your heart rate is 108, your oxygen is 94 percent, and your temperature is 37.4."], [28.55, "D", "Blood pressure is normal."], [29.98, "P", "Is 94 bad?"], [31.9, "P", "Oh, my cat knocked over my coffee this morning, so I haven't had any caffeine today."], [36.6, "P", "That's probably why I'm a little shaky."]]
  ],   // captions: [start (s), speaker, text]
  segments: [
    [
      ["D", "What brings you in today?"],
      ["P", "I've had chest pain for about four days. It comes and goes, mostly on the right side, and sometimes it's sharp. I thought it was my reflux. I've had that on and off for years, usually after coffee or spicy food, and I had a lot of both last week."],
      ["D", "Why last week?"],
      ["P", "I drove to Savannah to help my sister move. About nine hours each way. Lots of boxes and three flights of stairs. I got back last Sunday. But we had a nice walk along the river one evening."],
      ["D", "Any medications or allergies?"],
      ["P", "Omeprazole when the reflux is bad, and my birth control pill. No allergies."]
    ],
    [
      ["D", "What makes the pain worse?"],
      ["P", "Taking a deep breath. If I yawn, it catches right here. Maybe it's a little worse after dinner, but it's hard to tell. It stays in one spot. No fever, just a little cough yesterday."],
      ["D", "Anything else going on?"],
      ["P", "Work is stressful. We have a big deadline, and I haven't slept well. I had panic attacks in college, so maybe it's that. Oh, and my left calf is sore, probably from the stairs. It feels tight when I walk, and my ankle swells a little by the end of the day."]
    ],
    [
      ["D", "Any shortness of breath?"],
      ["P", "Yes, actually. Yesterday I had to stop halfway up the stairs at work. That's not like me. I run three times a week. My heart has been racing a little too, but I assumed it was the coffee."],
      ["D", "Any family history of blood clots?"],
      ["P", "Not that I know of. My mom had a vein problem in her leg after surgery once."],
      ["D", "Your heart rate is 108, your oxygen is 94 percent, and your temperature is 37.4. Blood pressure is normal."],
      ["P", "Is 94 bad? Oh, my cat knocked over my coffee this morning, so I haven't had any caffeine today. That's probably why I'm a little shaky."]
    ]
  ],
  // AI draft items released at each checkpoint (cp1, cp2) and after the visit (final)
  items: [
    [
      { id: "i01", after: 1, at: 3.77, sec: "Chief complaint", text: "Intermittent chest pain for 4 days." },
      { id: "i02", after: 1, at: 7.64, sec: "History of present illness", text: "Pain on the right side of the chest. Sometimes sharp." },
      { id: "i03", after: 1, at: 14.98, sec: "Pertinent history", text: "Reflux for several years, triggered by spicy food and coffee. Increased intake of both last week. Patient attributes current pain to reflux." },
      { id: "i04", after: 3, at: 24.34, sec: "Recent travel and activity", text: "Drove to Savannah to help sister move, about 9 hours each way. Returned last Sunday. Carried boxes up three flights of stairs during the move." },
      { id: "i05", after: 5, at: 34.73, sec: "Medications", text: "Omeprazole as needed.", seeded: "omission: oral contraceptive pill not documented" },
      { id: "i06", after: 5, at: 35.99, sec: "Allergies", text: "No known drug allergies." }
    ],
    [
      { id: "i07", after: 1, at: 6.5, sec: "History of present illness", text: "Pain worse with deep inspiration and yawning." },
      { id: "i08", after: 1, at: 10.26, sec: "History of present illness", text: "Unclear relationship to meals. Possibly slightly worse after dinner." },

/* ---------- think-aloud audio recording ---------- */
const REC = {
  stream: null, mr: null, chunks: [], tag: null, started: 0, blobs: {},
  async start(tag) {
    try {
      if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error("unsupported");
      if (!this.stream) this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.chunks = []; this.tag = tag;
      this.mr = new MediaRecorder(this.stream);
      this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
      this.mr.start(1000); this.started = now();
      try {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const srcNode = this.ctx.createMediaStreamSource(this.stream);
          this.an = this.ctx.createAnalyser(); this.an.fftSize = 1024;
          srcNode.connect(this.an); this.buf = new Float32Array(this.an.fftSize);
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      } catch (_) { this.an = null; }
      log("recording_start", { tag });
      return true;
    } catch (e) { log("recording_unavailable", { tag, error: String(e && e.name || e) }); return false; }
  },
  level() {
    if (!this.an) return null;
    this.an.getFloatTimeDomainData(this.buf);
    let sum = 0; for (let i = 0; i < this.buf.length; i++) sum += this.buf[i] * this.buf[i];
    return Math.sqrt(sum / this.buf.length);
  },
  stop() {
    return new Promise(res => {
      if (!this.mr || this.mr.state === "inactive") return res(null);
      const tag = this.tag, t0 = this.started;
      this.mr.onstop = () => {
        const blob = new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" });
        this.blobs[tag] = blob;
        const info = { tag, start_ms: t0, end_ms: now(), duration_ms: now() - t0, bytes: blob.size, mime: blob.type };
        log("recording_stop", info); res(info);
      };
      this.mr.stop();
    });
  }
};
function recBar(id) {
  return `<div class="recbar" id="${id}"><span class="recdot" aria-hidden="true"></span><span class="rectext">Checking the microphone</span><span class="mono rectime"></span></div>`;
}
function wireRecBar(bar, ok) {
  const txt = $(".rectext", bar), tm = $(".rectime", bar);
  if (!ok) { bar.classList.add("off"); txt.textContent = "Audio recording is not available in this browser view. In the lab sessions, the experimenter records the think-aloud."; return () => {}; }
  bar.classList.add("on"); txt.textContent = "Recording. Keep thinking aloud.";
  const t0 = performance.now();
  let quiet = 0, reminding = false;
  const iv = setInterval(() => {
    tm.textContent = fmt((performance.now() - t0) * SPEED / 1000);
    const lv = REC.level();
    if (lv == null) return;
    quiet = lv < 0.01 ? quiet + 500 : 0;
    if (quiet >= 8000 && !reminding) {
      reminding = true; txt.textContent = "Please keep thinking aloud. Say whatever is on your mind.";
      D.think_aloud.reminders = (D.think_aloud.reminders || 0) + 1; log("think_aloud_reminder", {});
    } else if (quiet === 0 && reminding) { reminding = false; txt.textContent = "Recording. Keep thinking aloud."; }
  }, 500);
  return () => clearInterval(iv);
}

/* ---------- detection response task ---------- */
const DRT = {
  phase: null, seg: null, dot: null, t1: 0, t2: 0, t3: 0, pending: null, n: 0,
  start(phase, dot, seg = null) {
    this.stop(); this.phase = phase; this.dot = dot; this.seg = seg;
    this.sched(rand(3000, 5000));
  },
  sched(designMs) { clearTimeout(this.t1); this.t1 = setTimeout(() => this.show(), designMs / DRT_SPEED); },
  show() {
    if (!this.phase || !this.dot) return;
    this.dot.classList.add("on");
    this.pending = { phase: this.phase, segment: this.seg, trial: ++this.n, onset_ms: now(), _on: performance.now() };
    this.t2 = setTimeout(() => this.dot && this.dot.classList.remove("on"), 1000);
    this.t3 = setTimeout(() => this.resolve(null, null, "miss"), 2500);
  },
  resolve(rt, target, outcome) {
    const p = this.pending; if (!p) return;
    this.pending = null; clearTimeout(this.t2); clearTimeout(this.t3);
    if (this.dot) this.dot.classList.remove("on");
    D.drt.push({ phase: p.phase, segment: p.segment, trial: p.trial, onset_ms: p.onset_ms, rt_ms: rt == null ? null : Math.round(rt), outcome, response_target: target });
    if (this.phase && outcome !== "truncated") {
      const elapsedDesign = (performance.now() - p._on) * DRT_SPEED;
      this.sched(Math.max(500, rand(3000, 5000) - elapsedDesign));
    }
  },
  press(e) {
    if (!this.phase) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    const inText = tag === "textarea" || (tag === "input" && /^(text|number|search)$/i.test(e.target.type || "text"));
    if (!inText) e.preventDefault();                 // no page scroll or button activation; spaces still type in text fields
    const target = inText ? "text_field" : "page";   // text_field = the space may also be a typed word break (G1, typing baseline)
    if (this.pending) {
      const rt = performance.now() - this.pending._on;
      if (rt < 100) { D.drt_false_alarms.push({ phase: this.phase, segment: this.seg, at_ms: now(), kind: "anticipation", target }); return; }
      this.resolve(rt, target, "hit");
    } else {
      D.drt_false_alarms.push({ phase: this.phase, segment: this.seg, at_ms: now(), kind: "no_stimulus", target });
    }
  },
  stop() {
    clearTimeout(this.t1);
    if (this.pending) this.resolve(null, null, "truncated");
    clearTimeout(this.t2); clearTimeout(this.t3);
    if (this.dot) this.dot.classList.remove("on");
    this.phase = null; this.seg = null;
  }
};
document.addEventListener("keydown", e => { if ((e.code === "Space" || e.key === " ") && !e.repeat) DRT.press(e); }, true);

function countdown(seconds, onTick, onDone) {

  onTick(seconds);

}

/* ---------- visit engine ---------- */
function runVisit(cd, phase, cpSec, rec, onDone) {
  const g = D.condition, C = CONDITIONS[g];
  const lines = cd.segments.flat();
  const VIDEO = !!(cd.video && !(TEST && QS.has("novideo")));
  const segDur = VIDEO ? cd.durations.slice() : cd.segments.map(seg => seg.reduce((s, l) => s + lineDur(l[1]), 0));
  const total = segDur.reduce((a, b) => a + b, 0);
  const segEnds = []; let acc = 0;
  segDur.forEach(d => { acc += d; segEnds.push(acc); });
  const ticks = segEnds.slice(0, -1).map(t => `<span class="tick" style="left:${(t / total * 100).toFixed(2)}%"></span>`).join("");
  const isAI = C.documenter === "ai";
  if (g === "G1" && !rec.self_note) rec.self_note = { snapshots: [], keystrokes: {} };

  const n = el(`<div class="wide"><div class="visit">
    <div>
      <div class="stage${VIDEO ? " has-video" : ""}" id="stage">
        <div class="drt-dot" id="dot"></div>
        ${isAI ? '<div class="badge"><i></i>AI scribe recording</div>' : ""}
        ${VIDEO ? '<video id="vid" playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate" tabindex="-1"></video>' : ""}
        <div class="speakers"${VIDEO ? " hidden" : ""}>
          <div class="spk" id="spkD"><div class="avatar">You</div><div class="nm">Clinician</div><div class="rl">You</div></div>
          <div class="spk" id="spkP"><div class="avatar">${esc(cd.patient.initials)}</div><div class="nm">${esc(cd.patient.name)}</div><div class="rl">${esc(cd.patient.label)}</div></div>
        </div>
        <div class="caption" id="cap" aria-live="polite"></div>
        <div class="overlay" id="ov"></div>
      </div>
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div>${ticks}</div>
      <div class="under"><span id="vstat">Ready</span><span class="mono" id="vtime">0:00 / ${fmt(total)}</span></div>
    </div>
    <aside class="panel" id="panel" aria-label="Clinical note"></aside>
  </div></div>`);
  app.append(n);
  const stage = $("#stage", n), ov = $("#ov", n), cap = $("#cap", n), fill = $("#fill", n), panel = $("#panel", n), dot = $("#dot", n);
  const vid = $("#vid", n);
  rec.video_events = [];
  const vlog = (type, extra = {}) => rec.video_events.push({ type, at_ms: now(), part: curSeg + 1, t: vid ? Math.round(vid.currentTime * 100) / 100 : null, ...extra });
  if (VIDEO) {
    vid.src = cd.video[0]; vid.dataset.part = "0"; vid.load();
    vid.addEventListener("contextmenu", e => e.preventDefault());
    ["waiting", "stalled", "error"].forEach(ev => vid.addEventListener(ev, () => vlog(ev)));
  }

  /* panel per condition */
  const aiItems = [];               // released draft items with review state
  let curSeg = 0, inPause = false;
  let selfTA = null;
  const keyCounts = {};
  if (g === "G1") {
    panel.innerHTML = `<div class="panel-h"><span class="t">Clinical note</span><span class="s">Written by you</span></div><div class="panel-b"><textarea id="selfnote" spellcheck="false" aria-label="Your clinical note" placeholder="${esc(NOTE_TEMPLATE)}"></textarea></div>`;
    selfTA = $("#selfnote", panel);
    selfTA.addEventListener("keydown", () => { const k = inPause ? `pause_${curSeg + 1}` : `segment_${curSeg + 1}`; keyCounts[k] = (keyCounts[k] || 0) + 1; });
    selfTA.addEventListener("paste", e => e.preventDefault());
  } else if (g === "G2") {
    panel.innerHTML = `<div class="panel-h"><span class="t">Clinical note</span><span class="s">Written by you after the visit</span></div><div class="panel-b"><p class="empty">Notes are not taken during this visit. You will write the note from memory after the visit ends.</p></div>`;
  } else if (g === "G3") {
    panel.innerHTML = `<div class="panel-h"><span class="t">Clinical note</span><span class="s">AI scribe recording</span></div><div class="panel-b"><p class="empty">The AI scribe is recording this visit. The draft note will be available after the visit.</p></div>`;
  } else {
    panel.innerHTML = `<div class="panel-h"><span class="t">AI draft note</span><span class="s" id="pstat">Listening</span></div><div class="panel-b" id="pbody"><p class="empty">${g === "G5"
      ? "The AI scribe is listening. Its draft appears here as the conversation goes on. At each pause, you confirm or correct the new items before the visit continues."
      : "The AI scribe is listening. Its draft appears here as the conversation goes on."}</p></div>`;
  }
  const stacked = () => window.matchMedia("(max-width: 920px)").matches;
  rec.ai_release = [];
  let newIds = [];

  /* live draft: release each AI item right after the line it is drawn from */
  function releaseItems(k, lineIdx) { releaseList(k, (cd.items[k] || []).filter(it => it.after === lineIdx)); }
  function releaseList(k, its) {
    if (!(g === "G4" || g === "G5")) return;
    if (!its.length) return;
    its.forEach(it => {
      aiItems.push({ ...it, seg: k, original: it.text, status: g === "G5" ? "pending" : "shown", actions: [] });
      rec.ai_release.push({ id: it.id, segment: k + 1, at_ms: now() });
      newIds.push(it.id);
    });
    renderDraft();
    const ps = $("#pstat", panel); if (ps) ps.textContent = "Updated";
    setTimeout(() => { const p = $("#pstat", panel); if (p && !inPause) p.textContent = "Listening"; }, 1500 / SPEED);
  }

  function renderDraft() {
    const body = $("#pbody", panel); body.innerHTML = "";
    NOTE_SECTIONS.forEach(sec => {
      const its = aiItems.filter(i => i.sec === sec);
      if (!its.length) return;
      const s = el(`<div class="note-sec"><h4>${esc(sec)}</h4><ul></ul></div>`);
      its.forEach(i => {
        const li = document.createElement("li");
        li.textContent = i.text;
        if (newIds.includes(i.id)) li.append(el('<span class="tag">New</span>'));
        if (g === "G5" && i.status === "pending") li.append(el('<span class="tag">To confirm</span>'));
        if (i.status === "corrected") li.append(el('<span class="tag">Corrected</span>'));
        $("ul", s).append(li);
      });
      body.append(s);
    });
    if (aiItems.some(i => i.added)) {
      const s = el(`<div class="note-sec"><h4>Added by clinician</h4><ul></ul></div>`);
      aiItems.filter(i => i.added).forEach(i => { const li = document.createElement("li"); li.textContent = i.text; $("ul", s).append(li); });
      body.append(s);
    }
  }

  /* playback */
  let played = 0, lineStart = 0, lineLen = 0, playing = false, vT = 0, watch = 0;
  let videoFailed = false;
  function videoExit(why) {
    if (videoFailed) return; videoFailed = true;
    vlog("video_failed", { why }); log("video_failed", { phase, part: curSeg + 1, why });
    try { vid.pause(); } catch (_) {}
    DRT.stop(); clearInterval(timeIv); clearInterval(watch);
    D.exit_reason = "video_failed";
    endStudyEarly();
  }
  const timeIv = setInterval(() => {
    const p = VIDEO ? vT : played + (playing ? Math.min(lineLen, (performance.now() - lineStart) * SPEED / 1000) : 0);
    $("#vtime", n).textContent = `${fmt(p)} / ${fmt(total)}`;
  }, 250);

  function showLine(l) {
    const who = l[0];
    $("#spkD", n).classList.toggle("on", who === "D");
    $("#spkP", n).classList.toggle("on", who === "P");
    if (VIDEO && !CONFIG.SHOW_CAPTIONS) return;
    cap.innerHTML = `<span><b>${who === "D" ? "Clinician:" : esc(cd.patient.name.split(" ")[0]) + ":"}</b>${esc(l[1])}</span>`;
  }

  /* video playback: captions and AI draft items follow the video clock */
  function playVideoSegment(k, done) {
    if (videoFailed) return;
    curSeg = k; inPause = false;
    const seg = cd.segments[k], cues = cd.cues[k], segStart = k ? segEnds[k - 1] : 0;
    const pending = (cd.items[k] || []).slice();
    $("#vstat", n).textContent = `Part ${k + 1} of ${cd.segments.length}`;
    if (g === "G4" || g === "G5") { newIds = []; if (aiItems.length) renderDraft(); const ps = $("#pstat", panel); if (ps) ps.textContent = "Listening"; }
    if (vid.dataset.part !== String(k)) { vid.src = cd.video[k]; vid.dataset.part = String(k); }
    fill.style.transition = "none";
    let li = -1, over = false, raf = 0;
    const tick = () => {
      if (over) return;
      const t = vid.currentTime;
      const cs = cd.subs ? cd.subs[k] : cues.map((c, i) => [c, seg[i][0], seg[i][1]]);
      let j = cs.length - 1; while (j > 0 && cs[j][0] > t) j--;
      if (j !== li) { li = j; showLine([cs[j][1], cs[j][2]]); }
      const due = pending.filter(it => it.at <= t);
      if (due.length) { due.forEach(it => pending.splice(pending.indexOf(it), 1)); releaseList(k, due); }
      vT = Math.min(total, segStart + t);
      fill.style.width = (vT / total * 100) + "%";
      raf = requestAnimationFrame(tick);
    };
    vid.ontimeupdate = tick;
    vid.onerror = () => videoExit("media_error");
    let lastT = -1, stuck = 0, blocked = false;
    clearInterval(watch);
    watch = setInterval(() => {              // a video that stops advancing for 25 seconds ends the session
      if (over || blocked || !playing) return;
      if (vid.currentTime === lastT) { if (++stuck >= 25) videoExit("stalled"); } else { lastT = vid.currentTime; stuck = 0; }
    }, 1000);
    vid.onended = () => {
      if (over) return; over = true; cancelAnimationFrame(raf); clearInterval(watch);
      if (pending.length) releaseList(k, pending.splice(0));
      vT = segEnds[k]; fill.style.width = (vT / total * 100) + "%";
      cap.innerHTML = ""; playing = false; DRT.stop(); vlog("ended"); done();
    };
    const start = () => {
      vid.playbackRate = SPEED;
      const pr = vid.play();
      if (pr && pr.catch) pr.then(() => { vlog("play"); if (!playing) { playing = true; DRT.start(phase, dot, k + 1); } raf = requestAnimationFrame(tick); }).catch(err => {
        if (err && err.name !== "NotAllowedError") return videoExit(String(err));
        vlog("play_blocked", { error: String(err) }); blocked = true;
        ov.hidden = false;
        ov.innerHTML = `<div class="big">Part ${k + 1} of ${cd.segments.length}</div><div class="sub">Click to start this part of the visit.</div><button class="btn" id="ovplay">Play</button>`;
        $("#ovplay", ov).onclick = () => { ov.hidden = true; blocked = false; start(); };
      });
    };
    start();
  }

  function playSegment(k, done) {
    if (VIDEO) return playVideoSegment(k, done);
    curSeg = k; inPause = false;
    const seg = cd.segments[k];
    $("#vstat", n).textContent = `Part ${k + 1} of ${cd.segments.length}`;
    if (g === "G4" || g === "G5") { newIds = []; if (aiItems.length) renderDraft(); const ps = $("#pstat", panel); if (ps) ps.textContent = "Listening"; }
    DRT.start(phase, dot, k + 1);
    let i = 0; playing = true;
    const go = () => {
      if (i >= seg.length) { playing = false; lineLen = 0; DRT.stop(); done(); return; }
      const l = seg[i]; showLine(l);
      lineLen = lineDur(l[1]); lineStart = performance.now();
      const ms = lineLen * 1000 / SPEED;
      fill.style.transition = `width ${ms}ms linear`;
      fill.style.width = ((played + lineLen) / total * 100) + "%";
      setTimeout(() => { played += lineLen; lineLen = 0; releaseItems(k, i); i++; go(); }, ms);
    };
    go();
  }

  function checkpoint(k, resume) {
    inPause = true;
    if (VIDEO && cd.video[k + 1]) { vid.src = cd.video[k + 1]; vid.dataset.part = String(k + 1); vid.load(); }
    const cp = { index: k + 1, condition: g, start_ms: now() };
    rec.checkpoints.push(cp);
    $("#vstat", n).textContent = "Break between parts";
    $("#spkD", n).classList.remove("on"); $("#spkP", n).classList.remove("on");
    ov.hidden = false;
    ov.innerHTML = `<div class="big">End of part ${k + 1} of ${cd.segments.length}</div><div class="sub" id="ovmsg">${esc(PAUSE_MSG[g])}</div><div class="mono" id="ovcd"></div>`;
    const released = g === "G5" ? aiItems.filter(i => i.status === "pending") : [];
    let missing = { answer: null, text: "" };

    if (g === "G1") rec.self_note && rec.self_note.snapshots.push({ at: `checkpoint_${k + 1}`, at_ms: now(), text: selfTA.value });
    if (g === "G4") { $("#pstat", panel).textContent = "Paused"; cp.items_visible = aiItems.map(i => i.id); }
    if (g === "G5") { renderReview(); $("#pstat", panel).textContent = "Review needed"; }
    if (g === "G5" && stacked()) {
      $("#ovmsg", ov).textContent = PAUSE_MSG[g] + " The draft note is below the video.";
      panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }

    function reviewDone() {
      return released.every(i => i.status !== "pending" && !i.editing) && missing.answer && (missing.answer === "No" || missing.text.trim().length > 0);
    }
    function renderReview() {
      const body = $("#pbody", panel); body.innerHTML = "";
      body.append(el(`<p class="hint">Check each new item against what the patient said. Confirm it if it is accurate. Correct it if anything is wrong.</p>`));
      const prior = aiItems.filter(i => !released.includes(i));
      if (prior.length) {
        const pd = el(`<details><summary>Earlier items (${prior.length})</summary><ul style="margin-top:6px;font-size:.88rem"></ul></details>`);
        prior.forEach(i => { const li = document.createElement("li"); li.textContent = i.text; $("ul", pd).append(li); });
        body.append(pd);
      }
      released.forEach(it => {
        const box = el(`<div class="ritem"><span class="st"></span><div class="tx"></div><div class="row"></div></div>`);
        $(".st", box).textContent = it.sec + (it.status === "confirmed" ? " · Confirmed" : it.status === "corrected" ? " · Corrected" : "");
        const row = $(".row", box);
        if (it.editing) {
          const ta = el(`<textarea aria-label="Corrected text" style="min-height:70px"></textarea>`); ta.value = it.text;
          $(".tx", box).append(ta);
          const save = el(`<button class="btn sm">Save correction</button>`);
          const cancel = el(`<button class="btn sm ghost">Cancel</button>`);
          save.onclick = () => {
            const v = ta.value.trim(); if (!v) return;
            it.text = v; it.status = v === it.original ? "confirmed" : "corrected"; it.editing = false;
            it.actions.push({ action: it.status === "corrected" ? "correct" : "confirm_via_edit", at_ms: now(), text: v });
            renderReview(); check();
          };
          cancel.onclick = () => { it.editing = false; it.actions.push({ action: "cancel_edit", at_ms: now() }); renderReview(); check(); };
          row.append(save, cancel);
          setTimeout(() => ta.focus(), 0);
        } else {
          $(".tx", box).textContent = it.text;
          if (it.status === "pending") {
            const ok = el(`<button class="btn sm">Confirm</button>`);
            const ed = el(`<button class="btn sm ghost">Correct</button>`);
            ok.onclick = () => { it.status = "confirmed"; it.actions.push({ action: "confirm", at_ms: now() }); renderReview(); check(); };
            ed.onclick = () => { it.editing = true; it.actions.push({ action: "open_edit", at_ms: now() }); renderReview(); check(); };
            row.append(ok, ed);
          } else {
            box.classList.add("done");
            const undo = el(`<button class="btn sm ghost">Change</button>`);
            undo.onclick = () => { it.status = "pending"; it.actions.push({ action: "undo", at_ms: now() }); renderReview(); check(); };
            row.append(undo);
          }
        }
        body.append(box);
      });
      const mq = el(`<div class="ritem"><span class="qtext">Is anything the patient said in this part missing from the draft?</span>
        <div class="row"><label class="opt" style="flex:1"><input type="radio" name="miss${k}" value="No"><span>No</span></label><label class="opt" style="flex:1"><input type="radio" name="miss${k}" value="Yes"><span>Yes</span></label></div>
        <textarea aria-label="Missing information" placeholder="Add the missing information" style="min-height:64px" ${missing.answer === "Yes" ? "" : "hidden"}></textarea></div>`);
      const mta = $("textarea", mq); mta.value = missing.text;
      $$("input", mq).forEach(r => { if (r.value === missing.answer) r.checked = true; r.onchange = () => { missing.answer = r.value; mta.hidden = r.value !== "Yes"; if (!mta.hidden) mta.focus(); check(); }; });
      mta.oninput = () => { missing.text = mta.value; check(); };
      body.append(mq);
    }

    let timeUp = false, finished = false;
    function check() {
      if (finished) return;
      if (g === "G5" && timeUp && !reviewDone()) $("#ovmsg", ov).textContent = "Confirm or correct each new item, and answer the question about missing information, to start the next part.";
      if (timeUp && (g !== "G5" || reviewDone())) finish();
    }
    countdown(cpSec, r => { const c = $("#ovcd", ov); if (c) c.textContent = r > 0 ? `Part ${k + 2} starts in ${fmt(r)}` : ""; }, () => { timeUp = true; check(); });

    function finish() {
      finished = true;
      cp.end_ms = now(); cp.duration_ms = cp.end_ms - cp.start_ms;
      if (g === "G5") {
        cp.items = released.map(i => ({ id: i.id, seeded: i.seeded || null, original: i.original, final: i.text, status: i.status, actions: i.actions }));
        cp.missing = { ...missing };
        if (missing.answer === "Yes" && missing.text.trim()) aiItems.push({ id: `add${k + 1}`, sec: "Added", text: missing.text.trim(), added: true, status: "added" });
        aiItems.forEach(i => { delete i.editing; });
      }
      if (g === "G4" || g === "G5") { newIds = []; renderDraft(); $("#pstat", panel).textContent = "Listening"; }
      ov.hidden = true;
      if (g === "G5" && stacked()) stage.scrollIntoView({ block: "start" });
      resume();
    }
  }

  function finishVisit() {
    clearInterval(timeIv);
    $("#vstat", n).textContent = "Visit ended";
    $("#vtime", n).textContent = `${fmt(total)} / ${fmt(total)}`;
    $("#spkD", n).classList.remove("on"); $("#spkP", n).classList.remove("on");
    if (g === "G1") {
      rec.self_note.snapshots.push({ at: "visit_end", at_ms: now(), text: selfTA.value });
      rec.self_note.keystrokes = keyCounts;
      rec.self_note.text_at_visit_end = selfTA.value;
      selfTA.readOnly = true;
    }
    if (g === "G4" || g === "G5") {
      aiItems.forEach(i => { if (i.status === "pending") i.status = "not_reviewed_in_visit"; });
      newIds = []; renderDraft(); $("#pstat", panel).textContent = "Draft complete";
    }
    rec.ai_items_state = aiItems.map(i => ({ id: i.id, text: i.text, original: i.original || null, status: i.status, added: !!i.added }));
    rec.visit_end_ms = now();
    ov.hidden = false;
    ov.innerHTML = `<div class="big">The visit has ended</div><div class="sub">${phase === "practice" ? "That was the practice visit." : "Next, you will give your diagnostic assessment. The note will not be available on the next pages."}</div><button class="btn" id="ovgo">Continue</button>`;
    $("#ovgo", ov).onclick = () => { panel.innerHTML = ""; onDone(); };
  }

  /* start overlay */
  ov.innerHTML = `<div class="big">${phase === "practice" ? "Practice visit" : "Study visit"}</div><div class="sub">Click Start when you are ready. <b>The video plays from start to end and cannot be paused or replayed.</b> Remember to press the space bar whenever the dot appears.</div><button class="btn" id="ovgo">Start</button>`;
  $("#ovgo", ov).onclick = () => {
    ov.hidden = true; rec.visit_start_ms = now(); log("visit_start", { phase });
    if (selfTA) selfTA.focus();
    const runFrom = k => playSegment(k, () => {
      if (k < cd.segments.length - 1) checkpoint(k, () => runFrom(k + 1));
      else finishVisit();
    });
    runFrom(0);
  };
}

/* 16. Note completion / review and sign */
function buildAINote() {
  const st = D.case.ai_items_state || [];
  const all = CASE.items.flat().map(it => {
    const s = st.find(x => x.id === it.id);
    return { ...it, text: s ? s.text : it.text };
  });
  const added = st.filter(x => x.added);
  let out = "CLINICAL NOTE (AI draft)\nPatient: Dana Reyes, 34, F\n";
  NOTE_SECTIONS.forEach(sec => {
    const its = all.filter(i => i.sec === sec);
    if (its.length) out += `\n${sec}\n` + its.map(i => `- ${i.text}`).join("\n") + "\n";
  });
  if (added.length) out += `\nAdded by clinician during visit\n` + added.map(i => `- ${i.text}`).join("\n") + "\n";
  out += "\nAssessment and plan\n- To be completed by the clinician.\n";
  return out;
}

/* 17b. Upload */
function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });
}
let uploaded = false;
async function sUpload() {
  screen("upload", "Finish");
  if (cur) cur.end_ms = now();
  const n = el(`<div class="col"><div class="card"><h3>Saving</h3><h1>Saving your responses</h1><p class="lede" id="upmsg">Please keep this page open. This can take up to a minute.</p><div class="actions"><button class="btn" id="go" hidden>Try again</button></div></div></div>`);
  app.append(n);
  const audio = REC.blobs.diagnosis;
  const payload = {
    kind: "complete", participant_id: D.participant_id, group: D.condition, test: TEST,
    record: D,
    audio: audio ? { mime: audio.type || "audio/webm", data: await blobToBase64(audio) } : null
  };
  const body = JSON.stringify(payload);
  async function attempt() {
    if (!CONFIG.ENDPOINT) throw new Error("no_endpoint");
    const r = await fetch(CONFIG.ENDPOINT, { method: "POST", body });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "save_failed");
    return j;
  }
  for (let i = 0; i < 3; i++) {
    try {
      const j = await attempt();
      uploaded = true; D.completion_code = j.completion_code || null;
      next(); return;
    } catch (e) { log("upload_error", { attempt: i, error: String(e) }); await new Promise(r => setTimeout(r, 2000)); }
  }
  $("#upmsg").textContent = "We could not save your responses. Please check your internet connection and click Try again. If it still fails, click Download my responses and email the file to the research team.";
  const go = $("#go"); go.hidden = false;
  const dl = el(`<button class="btn ghost" id="dl">Download my responses</button>`); go.before(dl);
  dl.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
    a.download = `ambient-study-${D.participant_id}.json`; document.body.append(a); a.click(); a.remove();
  };
  go.onclick = async () => {
    go.disabled = true; $("#upmsg").textContent = "Trying again…";
    try { const j = await attempt(); uploaded = true; D.completion_code = j.completion_code || null; next(); }
    catch (e) { log("upload_error", { attempt: "manual", error: String(e) }); go.disabled = false; $("#upmsg").textContent = "Still not saved. Please download your responses and email the file to the research team."; }
  };
}

/* backup: if the page closes before the final save, send what we have (no audio) */
function sendPartial() {
  if (uploaded || !CONFIG.ENDPOINT || !D.consent || !navigator.sendBeacon) return;
  try { navigator.sendBeacon(CONFIG.ENDPOINT, new Blob([JSON.stringify({ kind: "partial", participant_id: D.participant_id, group: D.condition, test: TEST, record: D })], { type: "text/plain" })); uploaded = true; } catch (_) {}
}
window.addEventListener("pagehide", sendPartial);

/* the study video could not play: save what we have and end the session */
function endStudyEarly() {
  REC.stopAll && REC.stopAll();
  sendPartial();
  screen("ended_video_failed", "Finish");
  app.append(el(`<div class="col"><div class="card">
    <h3>Study ended</h3>
    <h1>The video could not be played</h1>
    <p>We are sorry. The visit video could not play in this browser, so the study cannot continue. <b>Please close this page.</b></p>
    <p>If you would like to try again, open the link in a current version of Chrome, Edge or Firefox on a laptop or desktop computer with a stable internet connection.${CONFIG.CONTACT_EMAIL ? ` Questions: ${esc(CONFIG.CONTACT_EMAIL)}.` : ""}</p>
  </div></div>`));
}

/* 18. Debrief + session data */
function drtSummary() {
  const phases = ["baseline_watch", "baseline_typing", "practice", "visit"];
  return phases.map(ph => {
    const t = D.drt.filter(x => x.phase === ph && x.outcome !== "truncated");
    const hits = t.filter(x => x.outcome === "hit");
    const mean = hits.length ? Math.round(hits.reduce((s, x) => s + x.rt_ms, 0) / hits.length) : null;
    const fa = D.drt_false_alarms.filter(x => x.phase === ph).length;
    return { phase: ph, trials: t.length, hits: hits.length, hit_rate: t.length ? (hits.length / t.length) : null, mean_rt_ms: mean, false_alarms: fa };
  });
}
function toCSV() {
  const head = ["participant_id", "condition", "phase", "segment", "trial", "onset_ms", "rt_ms", "outcome", "response_target"];
  const rows = D.drt.map(r => [D.participant_id, D.condition, r.phase, r.segment ?? "", r.trial, r.onset_ms, r.rt_ms ?? "", r.outcome, r.response_target ?? ""]);
  return [head, ...rows].map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n");
}
function sDebrief() {
  screen("debrief", "Finish");
  if (cur) cur.end_ms = now();
  const g = D.condition;
  const ds = drtSummary();
  const cps = D.case.checkpoints.map(c => `${fmt(c.duration_ms / 1000)}`).join(", ");
  let g5 = "";
  if (g === "G5") {
    const its = D.case.checkpoints.flatMap(c => c.items || []);
    const seeded = its.filter(i => i.seeded);
    g5 = `<tr><td>Seeded draft problems caught at pauses</td><td>${seeded.map(i => `${esc(i.id)}: ${i.status === "corrected" ? "corrected" : "not corrected"}`).join(", ")}</td></tr>
          <tr><td>Items confirmed / corrected</td><td>${its.filter(i => i.status === "confirmed").length} / ${its.filter(i => i.status === "corrected").length}</td></tr>`;
  }
  const sc = D.case.final_note.seeded_checks;
  const n = el(`<div class="col">
    <div class="card">
      <h3>Thank you</h3>
      <h1>About this study</h1>
      <p>This study examines how the way a visit is documented shapes clinicians' diagnostic reasoning. Participants were assigned to write the note during the visit, write it after the visit, or have an ambient AI scribe draft it. In some AI conditions, the draft was shown during the visit, and in one condition, clinicians confirmed or corrected the draft at each pause.</p>
      <p>The AI scribe in this study was simulated. The draft notes were written in advance by the research team, and some contained deliberate errors so that we could study how clinicians review AI drafts. The patient and the visit were fictional. The instructions said you would write or review the clinical note at the end. That step was not part of the study, because we only needed your reasoning before any note was available.</p>
      <p>Please do not discuss the study with colleagues who may take part. If you have questions, contact the research team${CONFIG.CONTACT_EMAIL ? ` at ${esc(CONFIG.CONTACT_EMAIL)}` : ""}.</p>
    </div>
    <div class="card">
      <h3>Your gift card</h3>
      <p>Your responses have been saved. Your completion code is <b class="mono">${esc(D.completion_code || D.participant_id)}</b>.</p>
      ${CONFIG.GIFT_CARD_FORM_URL ? `<p>Enter this code in the gift card form. The form opens in a new tab and is not linked to your answers.</p><div class="actions"><a class="btn" href="${esc(CONFIG.GIFT_CARD_FORM_URL)}" target="_blank" rel="noopener">Open the gift card form</a></div>` : `<p>Please keep this code. The research team will contact you about your gift card.</p>`}
      <p class="hint">You can close this page now.</p>
    </div>
    <div class="card" ${TEST ? "" : "hidden"}>
      <h3>Session data for the research team</h3>
      <div class="tablewrap"><table class="sum"><tbody>
        <tr><td>Participant ID</td><td class="mono">${D.participant_id}</td></tr>
        <tr><td>Condition</td><td>${g}: ${esc(D.condition_label)}</td></tr>
        <tr><td>Reference diagnosis</td><td>${esc(CASE.reference_diagnosis)}</td></tr>
        <tr><td>Leading diagnosis given</td><td>${esc((D.case.diagnosis.ranked[0] || {}).diagnosis || "")} (confidence ${(D.case.diagnosis.ranked[0] || {}).confidence_1to7} of 7)</td></tr>
        <tr><td>Items recalled</td><td class="mono">${D.case.retention.n_items}</td></tr>
        <tr><td>Case summary</td><td>${esc(D.case.integration.summary_statement)} <span class="hint">(${D.case.integration.words} words)</span></td></tr>
        <tr><td>Think-aloud audio</td><td>${D.think_aloud.diagnosis ? `${fmt(D.think_aloud.diagnosis.duration_ms / 1000)} recorded, ${D.think_aloud.reminders || 0} reminders` : "Not recorded"}</td></tr>
        <tr><td>Assignment</td><td>${esc(D.assignment_method || "")}</td></tr>
        <tr><td>Pause durations</td><td class="mono">${cps}</td></tr>
        ${g === "G1" ? `<tr><td>Keystrokes during the visit</td><td class="mono">${Object.entries(D.case.self_note.keystrokes).map(([k, v]) => `${k}: ${v}`).join(", ") || "0"}</td></tr>` : ""}
        ${g5}
        ${sc ? `<tr><td>Final note: oral contraceptive documented</td><td>${sc.oral_contraceptive_documented ? "Yes" : "No"}</td></tr><tr><td>Final note: left calf documented</td><td>${sc.left_calf_documented ? "Yes" : "No"}</td></tr>` : ""}
        <tr><td>Times the page lost focus</td><td class="mono">${D.events.filter(e => e.type === "window_blur").length}</td></tr>
      </tbody></table></div>
      <h3>Response task</h3>
      <div class="tablewrap"><table class="sum">
        <thead><tr><th>Phase</th><th>Trials</th><th>Hit rate</th><th>Mean RT (ms)</th><th>False alarms</th></tr></thead>
        <tbody>${ds.map(r => `<tr><td>${r.phase.replace("_", " ")}</td><td class="mono">${r.trials}</td><td class="mono">${r.hit_rate == null ? "" : Math.round(r.hit_rate * 100) + "%"}</td><td class="mono">${r.mean_rt_ms ?? ""}</td><td class="mono">${r.false_alarms}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="actions" id="dlrow">
        <span class="hint" id="dlmsg" aria-live="polite"></span>
        <button class="btn ghost" id="copy">Copy JSON</button>
        <button class="btn ghost" id="csv">Save response task CSV</button>
        ${REC.blobs.diagnosis ? '<button class="btn ghost" id="aud">Save think-aloud audio</button>' : ""}
        <button class="btn" id="json">Save full data (JSON)</button>
      </div>
      <details><summary>Show full data record</summary><textarea id="raw" readonly style="min-height:320px;margin-top:10px;font-family:var(--mono);font-size:.78rem"></textarea></details>
      <div class="actions"><button class="btn ghost" id="again">Start a new test session</button></div>
    </div></div>`);
  app.append(n);
  const json = JSON.stringify(D, null, 2);
  $("#raw").value = json;
  const msg = t => $("#dlmsg").textContent = t;

  async function save(filename, data) {
    if (downloads) {
      try { await downloads.save({ filename, data }); msg("Saved " + filename + "."); }
      catch (e) { msg(e && e.code === "declined" ? "Save cancelled." : "Saving is not available here. Use Copy JSON instead."); }
      return;
    }
    if (!window.claude) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
      a.download = filename; document.body.append(a); a.click(); a.remove();
      msg("Saved " + filename + "."); return;
    }
    msg("Saving is not available here. Use Copy JSON instead.");
  }
  $("#json").onclick = () => save(`encounter-${D.participant_id}-${g}.json`, json);
  $("#csv").onclick = () => save(`drt-${D.participant_id}-${g}.csv`, toCSV());
  if ($("#aud")) $("#aud").onclick = () => save(`thinkaloud-${D.participant_id}-${g}.webm`, REC.blobs.diagnosis);
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(json); msg("Copied the data record."); }
    catch (_) { const d = $("details", n); d.open = true; const r = $("#raw"); r.focus(); r.select(); msg("Copy was blocked. The record is selected below, so press Ctrl+C or Cmd+C."); }
  };
  $("#again").onclick = () => { location.search = "?test=1"; };
}

/* test shortcut: ?test=1&jump=practice starts at group assignment, ?test=1&jump=visit&g=G4 starts at the study visit */
const JUMP = TEST ? QS.get("jump") : null;
if (JUMP === "practice") step = FLOW.indexOf(sAssign) - 1;
if (JUMP === "visit") {
  const jg = (QS.get("g") || "G4").toUpperCase(), cg = CONDITIONS[jg] ? jg : "G4";
  D.condition = cg; D.condition_label = CONDITIONS[cg].label; D.factors = CONDITIONS[cg]; D.assignment_method = "test_jump";
  D.consent = { agreed: true, at_ms: now(), test_jump: true };
  step = FLOW.indexOf(sCaseIntro) - 1;
}
next();
})();
</script>
